<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{block name="title"}ThinkPress{/block}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script defer src="/static/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#content">Langsung ke konten</a>
<header class="topbar"><div class="container nav-inner">
    <a class="brand" href="/blog"><span class="brand-mark" aria-hidden="true">t.</span>{$appName}</a>
    <nav aria-label="Navigasi utama">
        {if $user}
        <a href="/dashboard">Dashboard</a><a href="/articles">Artikel</a><a href="/categories">Kategori</a><a href="/blog">Blog publik</a><a href="/account">Akun</a>
        <form method="post" action="/logout"><input type="hidden" name="_token" value="{$csrf}"><button class="nav-button" type="submit">Keluar</button></form>
        {else/}<a href="/blog">Jurnal</a><a href="/login">Masuk admin</a>{/if}
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Ganti tema tampilan">◐</button>
    </nav>
</div></header>
<main class="container main-content" id="content">
    {if !empty($flash['message'])}<div class="alert {$flash.type|default='success'}" role="status">{$flash.message}</div>{/if}
    {block name="content"}{/block}
</main>
<footer class="container footer"><span>{$appName} <span class="muted">/ ruang untuk ide yang berarti.</span></span><span>Powered by ThinkPHP</span></footer>
</body></html>
